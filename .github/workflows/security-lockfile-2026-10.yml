# Temporary workflow for the October 2026 security remediation PR.
# Remove this workflow after the lockfile and checks have been generated.
name: Regenerate security lockfile
on:
  push:
    branches:
      - security/nextjs-2026-10-24
permissions:
  contents: write
jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched versions and regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(lockfile): regenerate after security update [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Clean dependency installation
        run: npm ci --no-audit --no-fund
      - name: Existing tests
        run: npm test
      - name: Next.js static export build
        run: npm run build
